name: KAT Transit Realtime Collector

on:
  schedule:
    - cron: '*/5 * * * *'  # Runs every 5 minutes
  workflow_dispatch:      # Enables manual trigger button in GitHub UI

permissions:
  contents: write

jobs:
  collect-kat-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch KAT GTFS-RT JSON Snapshots
        run: python collector.py

      - name: Commit and Push Clean JSON Diffs
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automated KAT GTFS-RT update [skip ci]"
          file_pattern: "data/*.json"
