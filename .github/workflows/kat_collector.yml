name: KAT Transit Realtime Collector

on:
  schedule:
    - cron: '*/5 * * * *'  # Triggered every 5 minutes
  workflow_dispatch:      # Manual run button in GitHub UI

jobs:
  collect-kat-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch KAT Vehicle & Delay Data
        run: python collector.py

      - name: Commit and Push Parquet Updates
        run: |
          git config --global user.name "kat-data-bot"
          git config --global user.email "kat-data-bot@users.noreply.github.com"
          git add data/
          git commit -m "Automated KAT GTFS-RT update [skip ci]" || exit 0
          git push
