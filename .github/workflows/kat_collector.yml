name: GTFS-RT Collector

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allows manual trigger testing

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install requests gtfs-realtime-bindings

      - name: Run Collector
        run: python collector.py

      - name: Commit and Push Snapshot
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automated GTFS-RT update [skip ci]"
          file_pattern: "data/*.json"
